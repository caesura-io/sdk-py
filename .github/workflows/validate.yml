name: Validate distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        openai-major: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install source and selected OpenAI major
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          OPENAI_MAJOR: ${{ matrix.openai-major }}
        run: |
          uv sync --all-packages
          uv pip install "openai>=${OPENAI_MAJOR},<$((OPENAI_MAJOR + 1))"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy .
      - run: uv run --no-sync pytest
      - name: Build wheels and source distributions
        run: uv build --all-packages
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: Test clean wheel and source installations
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          OPENAI_MAJOR: ${{ matrix.openai-major }}
        run: |
          uv run --no-sync python scripts/check_distribution.py --openai "$OPENAI_MAJOR" --kind wheel
          uv run --no-sync python scripts/check_distribution.py --openai "$OPENAI_MAJOR" --kind sdist
